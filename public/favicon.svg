<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shield Inner Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.92" />
    </linearGradient>

    <!-- Syringe Accent Gradient -->
    <linearGradient id="syringeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <!-- Syringe Shadow -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle Icon) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Top Highlight / Gloss -->
  <path d="M 0,128 C 0,57.3 57.3,0 128,0 L 384,0 C 454.7,0 512,57.3 512,128 C 512,180 340,240 256,240 C 172,240 0,180 0,128 Z" fill="#ffffff" opacity="0.12" />

  <!-- Outer Protective Shield Outline -->
  <path d="M 256,70 C 330,70 400,98 400,165 C 400,295 295,385 256,425 C 217,385 112,295 112,165 C 112,98 182,70 256,70 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#dropShadow)" />

  <!-- Shield Inner Border -->
  <path d="M 256,92 C 315,92 376,114 376,172 C 376,280 288,360 256,396 C 224,360 136,280 136,172 C 136,114 197,92 256,92 Z" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="6" 
        opacity="0.25" />

  <!-- Medical Cross in Shield Center Background -->
  <g opacity="0.15">
    <rect x="226" y="160" width="60" height="150" rx="12" fill="#059669" />
    <rect x="181" y="205" width="150" height="60" rx="12" fill="#059669" />
  </g>

  <!-- Vaccination Syringe & Drops (Dynamic 45-degree angle) -->
  <g transform="translate(256,245) rotate(-45) translate(-256,-245)" filter="url(#elementShadow)">
    <!-- Needle -->
    <line x1="256" y1="90" x2="256" y2="155" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <!-- Needle Base Hub -->
    <path d="M 242,155 L 270,155 L 264,170 L 248,170 Z" fill="#64748b" />

    <!-- Syringe Barrel Body -->
    <rect x="228" y="170" width="56" height="135" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="7" />
    
    <!-- Vaccine Fluid Inside Barrel -->
    <rect x="235" y="195" width="42" height="100" rx="6" fill="url(#liquidGrad)" />
    
    <!-- Fluid Measurement Ticks -->
    <line x1="235" y1="210" x2="247" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="235" y1="230" x2="252" y2="230" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="235" y1="250" x2="247" y2="250" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="235" y1="270" x2="252" y2="270" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Barrel Flange / Wings -->
    <rect x="210" y="305" width="92" height="14" rx="7" fill="#0f766e" />

    <!-- Plunger Shaft -->
    <rect x="250" y="319" width="12" height="48" fill="#64748b" />

    <!-- Plunger Top Thumb Rest -->
    <rect x="224" y="367" width="64" height="14" rx="7" fill="#0f766e" />

    <!-- Vaccine Sparkling Droplet at Needle Tip -->
    <circle cx="256" cy="68" r="9" fill="#0284c7" />
    <path d="M 256,54 C 256,54 247,66 247,72 C 247,77 251,81 256,81 C 261,81 265,77 265,72 C 265,66 256,54 256,54 Z" fill="#38bdf8" />
  </g>

  <!-- Sparkle of Safety / Immunity Stars -->
  <g fill="#0284c7" opacity="0.9">
    <!-- Star 1 -->
    <path d="M 360,140 Q 360,155 375,155 Q 360,155 360,170 Q 360,155 345,155 Q 360,155 360,140 Z" fill="#0284c7" />
    <!-- Star 2 -->
    <path d="M 150,260 Q 150,272 162,272 Q 150,272 150,284 Q 150,272 138,272 Q 150,272 150,260 Z" fill="#10b981" />
  </g>
</svg>
