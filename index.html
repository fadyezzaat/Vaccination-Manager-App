        tempMap.dose1 = idx;

        hasHeader = true;
      } else if (c.includes('الثانية') || c.includes('الثانيه') || c.includes('dose2') || c.includes('dose 2') || c.includes('الجرعة 2') || c.includes('الجرعه 2')) {
        tempMap.dose2 = idx;
        foundFields++;

      } else if (c.includes('الثالثة') || c.includes('الثالثه') || c.includes('dose3') || c.includes('dose 3') || c.includes('الجرعة 3') || c.includes('الجرعه 3')) {

        foundFields++;
        hasHeader = true;

        foundFields++;
        hasHeader = true;

    });

    if (hasHeader && foundFields >= 2) {

      headerIndex = 0;
    } else {
      // Analyze values of first few lines to auto-detect columns
      let sampleRows = [];
      for (let i = 0; i < Math.min(lines.length, 5); i++) {
        let cells = lines[i].split('\t');
        if (cells.length === 1) {
          if (lines[i].includes(',')) cells = lines[i].split(',');
          else if (lines[i].includes(';')) cells = lines[i].split(';');
        }
        const cleaned = cells.map(c => c.trim().replace(/^["']|["']$/g, ''));
        if (cleaned.length > 0 && cleaned.some(x => x)) {
          sampleRows.push(cleaned);

      }

      if (sampleRows.length > 0) {

          nidScore: 0,

        sampleRows.forEach(row => {

            if (/^\d{14}$/.test(cleanDigits)) {
              colScores[idx].nidScore += 10;

            const hasLetters = /[\u0600-\u06FFa-zA-Z]/.test(cell);

    }
